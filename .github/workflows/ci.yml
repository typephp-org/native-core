name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  zend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.2', '8.4']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: php tests/lint.php
      - run: php tests/run.php
      - run: php tests/composer-autoload.php
      - run: php examples/hello-console/run-zend.php
      - run: php examples/worker/run-zend.php
